name: Theme tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installable theme archive
        run: node scripts/package-theme.mjs

      - name: Run theme tests
        run: node --test tests/theme-structure.test.mjs tests/presence-profile.test.mjs

